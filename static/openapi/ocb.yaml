info:
  title: Iot Breeze OCB
  description: "Omni Channel Backend for managing your iot applications "
  version: "0.9.0"
  contact: {}
tags: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Enter your JWT token
    supabase:
      type: oauth2
      flows:
        password:
          tokenUrl: /rest/v1/auth/token/swagger-oauth
          scopes: {}
  schemas:
    FileVariants:
      type: object
      properties:
        "50":
          type: string
          description: size 50
        "100":
          type: string
          description: size 100
        "250":
          type: string
          description: size 250
        "400":
          type: string
          description: size 400
        "700":
          type: string
          description: size 700
        "1200":
          type: string
          description: size 1200
        default:
          type: string
          description: default size
      required:
        - default
    FileVariantDefault:
      type: object
      properties:
        default:
          type: string
          description: default size
      required:
        - default
    SmtpConfig:
      type: object
      properties:
        host:
          type: string
          description: host
        port:
          type: number
          description: port
        username:
          type: string
          description: username
        password:
          type: string
          description: password
        from:
          type: string
          description: from
        secure:
          type: boolean
          description: secure
      required:
        - host
        - port
        - username
        - password
        - from
        - secure
    TenantTheme:
      type: object
      properties:
        darkMode:
          type: boolean
          description: darkMode
          default: false
        palette:
          type: object
          description: theme
          patternProperties:
            string:
              properties:
                string:
                  type: array
                  items:
                    type: number
                    maxProperties: 3
                    minProperties: 3
                  default:
                    - 0
                    - 0
                    - 0
        shadcnTheme:
          type: object
          description: shadcnTheme
      required:
        - darkMode
    TenantKey:
      type: object
      properties:
        id:
          type: string
          description: id
        key:
          type: string
          description: key
        rotatedAt:
          format: date-time
          type: string
          description: rotatedAt
      required:
        - id
        - key
        - rotatedAt
    TenantKeys:
      type: object
      properties:
        primary:
          description: primary
          allOf:
            - $ref: "#/components/schemas/TenantKey"
        secondary:
          description: secondary
          allOf:
            - $ref: "#/components/schemas/TenantKey"
      required:
        - primary
        - secondary
    TenantOutDao:
      type: object
      properties:
        id:
          type: string
          description: id
        name:
          type: string
          description: name
        customName:
          type: string
          description: customName
        description:
          type: object
          description: description
          properties:
            en:
              type: string
            de:
              type: string
            fr:
              type: string
        searchLabels:
          type: string
          description: searchLabels
        type:
          type: string
          enum:
            - Organization
            - User
            - Shared
          description: type
          default: Organization
        logo:
          description: logo
          default: {}
          allOf:
            - $ref: "#/components/schemas/FileVariants"
        icon:
          description: icon
          default: {}
          allOf:
            - $ref: "#/components/schemas/FileVariantDefault"
        smtpConfig:
          description: smtpConfig
          allOf:
            - $ref: "#/components/schemas/SmtpConfig"
        timezone:
          type: string
          description: timezone
        defaultLanguage:
          type: string
          description: language
          enum:
            - EN
            - DE
            - FR
          default: EN
        theme:
          description: theme
          allOf:
            - $ref: "#/components/schemas/TenantTheme"
        publicKey:
          type: string
          description: publicKey
        dbName:
          type: string
          description: dbName
        schema:
          type: string
          description: schema
        tenantKeys:
          description: tenantKeys
          allOf:
            - $ref: "#/components/schemas/TenantKeys"
      required:
        - tenantKeys
    TenantKeyRotationDao:
      type: object
      properties:
        primary:
          type: boolean
          description: primary
        secondary:
          type: boolean
          description: secondary
      required:
        - primary
        - secondary
    PublicTenantOutDao:
      type: object
      properties:
        id:
          type: string
          description: id
        name:
          type: string
          description: name
        customName:
          type: string
          description: customName
        description:
          type: object
          description: description
          properties:
            en:
              type: string
            de:
              type: string
            fr:
              type: string
        searchLabels:
          type: string
          description: searchLabels
        type:
          type: string
          enum:
            - Organization
            - User
            - Shared
          description: type
          default: Organization
        logo:
          description: logo
          default: {}
          allOf:
            - $ref: "#/components/schemas/FileVariants"
        icon:
          description: icon
          default: {}
          allOf:
            - $ref: "#/components/schemas/FileVariantDefault"
        smtpConfig:
          description: smtpConfig
          allOf:
            - $ref: "#/components/schemas/SmtpConfig"
        timezone:
          type: string
          description: timezone
        defaultLanguage:
          type: string
          description: language
          enum:
            - EN
            - DE
            - FR
          default: EN
        theme:
          description: theme
          allOf:
            - $ref: "#/components/schemas/TenantTheme"
        tenantKeys:
          description: tenantKeys
          allOf:
            - $ref: "#/components/schemas/TenantKeys"
    TenantUpdateDaoNoIconNoLogo:
      type: object
      properties:
        customName:
          type: string
          description: customName
        description:
          type: object
          description: description
          properties:
            en:
              type: string
            de:
              type: string
            fr:
              type: string
        searchLabels:
          type: string
          description: searchLabels
        smtpConfig:
          description: smtpConfig
          allOf:
            - $ref: "#/components/schemas/SmtpConfig"
        timezone:
          type: string
          description: timezone
        defaultLanguage:
          type: string
          description: language
          enum:
            - EN
            - DE
            - FR
          default: EN
        theme:
          description: theme
          allOf:
            - $ref: "#/components/schemas/TenantTheme"
    SingleFileDto:
      type: object
      properties:
        file:
          type: string
          format: binary
        tags:
          type: string
        customerManaged:
          type: boolean
      required:
        - file
    AzureDpsOptions:
      type: object
      properties:
        azureIotHubConnectionString:
          type: string
          description: azureIotHubConnectionString
        azureIotProvisioningIdScope:
          type: string
          description: azureIotProvisioningIdScope
        azureIotProvisioningHost:
          type: string
          description: azureIotProvisioningHost
        azureIotDpsConnectionString:
          type: string
          description: azureIotDpsConnectionString
      required:
        - azureIotHubConnectionString
        - azureIotProvisioningIdScope
        - azureIotProvisioningHost
        - azureIotDpsConnectionString
    InitialUser:
      type: object
      properties:
        email:
          type: string
          description: email
        password:
          type: string
          description: password
        firstName:
          type: string
          description: firstName
        lastName:
          type: string
          description: lastName
        roles:
          description: roles
          type: array
          items:
            type: string
      required:
        - email
        - password
        - firstName
        - lastName
        - roles
    TenantAuthConfigInDaoWithTenantAndUser:
      type: object
      properties:
        url:
          type: string
          description: url
        tenantName:
          type: string
          description: tenantName
        customTenantName:
          type: string
          description: customTenantName
        tenantType:
          type: string
          description: tenantType
          enum:
            - Organization
            - User
            - Shared
          default: Organization
        azureDpsOptions:
          description: azureDpsOptions
          allOf:
            - $ref: "#/components/schemas/AzureDpsOptions"
        initialUser:
          description: initialUser
          allOf:
            - $ref: "#/components/schemas/InitialUser"
      required:
        - url
        - tenantName
        - customTenantName
        - tenantType
        - azureDpsOptions
        - initialUser
    PropertyTypes:
      type: string
      enum:
        - string
        - boolean
        - datetime
        - numeric
      description: dataType
    Translation:
      type: object
      properties:
        locale:
          type: string
          description: Locale code (e.g., "en", "de")
          example: en
        translation:
          type: string
          description: Translated string for the locale
          example: Temperature
      required:
        - locale
        - translation
    DisplayNameTranslations:
      type: object
      properties:
        fallbackName:
          type: string
          description: Fallback display name
          example: temp
        translations:
          description: List of translations by locale
          example:
            - locale: de
              translation: td
            - locale: en
              translation: te
          type: array
          items:
            $ref: "#/components/schemas/Translation"
      required:
        - fallbackName
        - translations
    CapProperty:
      type: object
      properties:
        id:
