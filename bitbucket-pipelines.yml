image: node:24

pipelines:
  branches:
    development:
      - parallel:
          - step:
              name: Build and Deploy to Bitbucket Pages
              caches:
                - node
                - pnpm
              script:
                # Enable corepack (recommended for pnpm on Node 16+)
                - corepack enable
                - corepack prepare pnpm@10.3.0 --activate

                # Install dependencies
                - pnpm install

                # Build project
                - pnpm run build

                # Debug / verify location
                - pwd
                - cd ..
                - ls -la

                # Clone deployment repo
                - git clone https://x-token-auth:$TOKEN@bitbucket.org/cparsinnovationlab/cparsinnovationlab.bitbucket.io.git
                - cd cparsinnovationlab.bitbucket.io

                # Configure git user
                - git config user.email "$TOKEN_ID@bots.bitbucket.org"
                - git config user.name "Bitbucket Pipelines"

                # Create target dir
                - mkdir -p nimbit

                # Copy build output
                - cp -r ../build/build/* ./nimbit

                # Commit & push
                - git add .
                - git commit -m "Deploy Docusaurus documentation" || echo "No changes to commit"
                - git push

    master:
      - step:
          name: Build and Deploy via FTP
          caches:
            - node
            - pnpm
          script:
            # Corepack aktivieren
            - corepack enable
            - corepack prepare pnpm@10.3.0 --activate

            # Abhängigkeiten installieren
            - pnpm install

            # Projekt bauen (baseUrl auf / für FTP-Deployment überschreiben)
            - DOCUSAURUS_BASE_URL=/ pnpm run build

            # lftp installieren
            - apt-get update && apt-get install -y lftp

            # Pflichtumgebungsvariablen prüfen
            - |
              for var in FTP_USER FTP_PASSWORD FTP_HOST; do
                val="${!var}"
                if [ -z "$val" ]; then
                  echo "Fehler: $var ist nicht gesetzt oder leer." >&2
                  exit 1
                fi
              done

            # Build-Ausgabe per FTPS in nimbit/ hochladen
            - lftp -c "
              set ftp:ssl-force yes;
              set ssl:verify-certificate yes;
              set net:timeout 30;
              set net:max-retries 2;
              set net:reconnect-interval-base 5;
              open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$FTP_HOST\";
              mirror --reverse --delete build/ .;
              bye
              "

definitions:
  caches:
    pnpm: ~/.pnpm-store
