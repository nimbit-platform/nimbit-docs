image: node:24

pipelines:
  branches:
    development:
      - parallel:
          - step:
              name: Build and Deploy to Bitbucket Pages
              caches:
                - node
                - pnpm
              script:
                # Enable corepack (recommended for pnpm on Node 16+)
                - corepack enable
                - corepack prepare pnpm@latest --activate

                # Install dependencies
                - pnpm install

                # Build project
                - pnpm run build

                # Debug / verify location
                - pwd
                - cd ..
                - ls -la

                # Clone deployment repo
                - git clone https://x-token-auth:$TOKEN@bitbucket.org/cparsinnovationlab/cparsinnovationlab.bitbucket.io.git
                - cd cparsinnovationlab.bitbucket.io

                # Configure git user
                - git config user.email "$TOKEN_ID@bots.bitbucket.org"
                - git config user.name "Bitbucket Pipelines"

                # Create target dir
                - mkdir -p nimbit

                # Copy build output
                - cp -r ../build/build/* ./nimbit

                # Commit & push
                - git add .
                - git commit -m "Deploy Docusaurus documentation" || echo "No changes to commit"
                - git push

    master:
      - step:
          name: Build and Deploy via FTP
          caches:
            - node
            - pnpm
          script:
            # Enable corepack
            - corepack enable
            - corepack prepare pnpm@latest --activate

            # Install dependencies
            - pnpm install

            # Build project
            - pnpm run build

            # Install lftp for FTP upload
            - apt-get update && apt-get install -y lftp

            # Upload build output to FTP server
            - lftp -c "
              set ftp:ssl-allow no;
              open -u $FTP_USER,$FTP_PASSWORD $FTP_HOST;
              mirror --reverse --delete --verbose build/ $FTP_REMOTE_PATH
              "

definitions:
  caches:
    pnpm: ~/.pnpm-store
