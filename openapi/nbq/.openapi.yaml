          $ref: '#/components/responses/NotFound'
  /api/v1/admin/analytics/{id}/validate:
    post:
      operationId: analyticsValidate
      summary: Validate an analytic definition against sample data
      description: |
        Runs the analytic against the in-memory seed dataset and returns
        a schema inference + sample output. Authoring tool path.
      tags:
      - analytics-admin
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  output_schema:
                    type: array
                    items:
                      $ref: '#/components/schemas/AnalyticColumnDef'
                  sample_output:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/analytics/reload:
    post:
      operationId: analyticsReload
      summary: Reload analytic definitions from store
      description: Forces the in-process analytic registry to re-load from SQLite.
      tags:
      - analytics-admin
      responses:
        '200':
          description: Reload completed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
