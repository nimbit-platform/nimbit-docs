openapi: 3.0.1
info:
  title: Nimbit Query Engine
  description: Nimbit IoT query engine.
  contact:
    name: Nimbit support
    url: https://www.nimbit.de
    email: iot@nimbit.de
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: "1.0"
externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
servers:
- url: /api/v1
paths:
  /geo:
    get:
      tags:
      - Geo
      summary: Device Geo position
      description: GetForRange geo position for all devices
      parameters:
      - name: measurement
        in: query
        description: measurement
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/nbq_internal_models.Geo'
  /geo/{id}:
    get:
      tags:
      - Geo
      summary: Device Geo position
      description: GetForRange geo position for device
      parameters:
      - name: id
        in: path
        description: id
        required: true
        schema:
          type: string
      - name: measurement
        in: query
        description: measurement
        schema:
          type: string
      - name: fields
        in: query
        description: Comma separated list of fields(will limit the response)
        schema:
          type: string
      - name: reverse
        in: query
        description: Geo reverse
        schema:
          type: boolean
      - name: lang
        in: query
        description: Address language
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/nbq_internal_models.GeoWithReverse'
  /geo/{id}/path:
    get:
      tags:
      - Geo
      summary: Geo Path
      description: Geo Path
      parameters:
      - name: id
        in: path
        description: id
        required: true
        schema:
          type: string
      - name: measurement
        in: query
        description: measurement
        schema:
          type: string
      - name: start
        in: query
        description: Start time Epoch in miliseconds
        required: true
        schema:
          type: integer
      - name: end
        in: query
        description: End time Epoch in miliseconds
        required: true
        schema:
          type: integer
      - name: limit
        in: query
        description: End time Epoch in miliseconds
        schema:
          type: integer
      - name: meters
        in: query
        description: Used to filter most relevant data points representing movement.
          Only values where a move greater or equal to the desired meters will be
          shown
        schema:
          type: integer
      - name: includeCurrentPosition
        in: query
        description: Used to filter most relevant data points representing movement.
          Only values where a move greater or equal to the desired meters will be
          shown
        schema:
          type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/nbq_internal_models.GeoPath'
  /geo/{id}/reverse:
    get:
      tags:
      - Geo
      summary: Geo Reverse
      description: Geo Reverse (address)
      parameters:
      - name: id
        in: path
        description: id
        required: true
        schema:
          type: string
      - name: measurement
        in: query
        description: measurement
        schema:
          type: string
      - name: lang
        in: query
        description: Address language
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/nbq_internal_models.GeoReverse'
  /geo/count:
    get:
      tags:
      - Geo
      summary: Count devices with geo position
      description: Count devices with geo position
      parameters:
      - name: measurement
        in: query
        description: measurement
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: number

  /heartbeat:
    get:
      tags:
      - Hearbeat
      summary: View Heartbeat
      description: View Hearbeat for all devices
      parameters:
      - name: measurement
        in: query
        description: measurement
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/nbq_internal_models.Heartbeat'

  /heartbeat/{id}:
    get:
      tags:
      - Hearbeat
      summary: View Heartbeat
      description: View Hearbeat for all device
      parameters:
      - name: id
        in: path
        description: id
        required: true
        schema:
          type: string
      - name: measurement
        in: query
        description: measurement
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/nbq_internal_models.Heartbeat'

  /heartbeat/count:
    get:
      tags:
      - Hearbeat
      summary: Count Devices with a heartbeat
      description: Count Devices with a heartbeat
      parameters:
      - name: measurement
        in: query
        description: measurement
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: number

  /jobs:
    get:
      tags:
      - Jobs
      summary: List jobs by type
      description: List all background jobs of a specific type
      parameters:
      - name: type
        in: query
        description: job type
        required: true
        schema:
          type: string
          enum:
          - correlation_update
          - quantile_update
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/nbq_internal_models.BackgroundJob'
  /jobs/{id}:
    get:
      tags:
      - Jobs
      summary: Get job status
      description: Get status of a background job
      parameters:
      - name: id
        in: path
        description: job ID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/nbq_internal_models.BackgroundJob'
    delete:
      tags:
      - Jobs
      summary: Delete job
      description: Delete a background job
      parameters:
      - name: id
        in: path
        description: job ID
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
          content:
            application/json:
              schema:
                type: string
  /metering/size/measurement/{measurement}:
    get:
      tags:
      - Metering
      summary: Returns the approximate count of the data points for a specific measurement
        and its aggregates
      description: Returns the approximate count of the data points for a specific
        measurement and its aggregates
      parameters:
      - name: measurement
        in: path
        description: measurement
        required: true
        schema:
          type: string
      - name: startDate
        in: query
        description: Start Date
        schema:
          type: string
      - name: endDate
        in: query
        description: End Date
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/nbq_internal_models.MeasurementSize'
  /metering/size/tenant:
    get:
      tags:
      - Metering
      summary: "Returns current tenant size ( number of data points, disk size )"
      description: Returns the approximate count of the data points and disk size
        the current tenant
      parameters:
      - name: startDate
        in: query
        description: Start Date
        schema:
          type: string
      - name: endDate
        in: query
        description: End Date
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/nbq_internal_models.TenantSize'
  /smartinsights/correlation/{measurement}:
    get:
      tags:
      - SmartInsights
      summary: Get latest correlation profile
      description: Get latest correlation profile
      parameters:
      - name: measurement
        in: path
        description: measurement
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/nbq_internal_models.CorrelationResult'
  /smartinsights/correlation/{measurement}/update:
    get:
      tags:
      - SmartInsights
      summary: Update correlation profile
      description: Trigger correlation profile update
      parameters:
      - name: measurement
        in: path
        description: measurement
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
          content:
            application/json:
              schema:
                type: string
  /smartinsights/quantile/{measurement}:
    get:
      tags:
      - SmartInsights
      summary: Get latest quantile profile
      description: Get latest quantile profile
      parameters:
      - name: measurement
        in: path
        description: measurement
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/nbq_internal_models.QuantileResponse'
  /tags:
    get:
      tags:
      - Tags
      summary: Find tags
      description: Find Tag by Tag ID
      parameters:
      - name: measurement
        in: query
        description: measurement
        schema:
          type: string
      - name: limit
        in: query
        description: Page limit default 200
        schema:
          type: integer
      - name: page
        in: query
        description: Page number
        schema:
          type: integer
      - name: tags
        in: query
        description: Tag values (key-value pairs)
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/nbq_internal_models.TagsWithPagination'
  /tags/byId/{id}:
    get:
      tags:
      - Tags
      summary: Find by device id
      description: Find Tag by device id
      parameters:
      - name: id
        in: path
        description: Device id
        required: true
        schema:
          type: string
      - name: tags
        in: query
        description: Tag values (key-value pairs)
        schema:
          type: string
      - name: limit
        in: query
        description: Page limit default 200
        schema:
          type: integer
      - name: page
        in: query
        description: Page number
        schema:
          type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/nbq_internal_models.TagsWithPagination'
  /tags/byTagId/{tag_id}:
    get:
      tags:
      - Tags
      summary: Find Tag by TagId
      description: Find Tag by Tag ID
      parameters:
      - name: tag_id
        in: path
        description: Tag ID
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/nbq_internal_models.TagsOut'
  /timeseries:
    post:
      tags:
      - Timeseries
      summary: Read a device Snapshot values (last values)
      description: The snapshot endpoint will per default return the last value for
        all properties available for a thing. Use the fields parameter to send a comma
        separated list of fields of only specific fields are required.
      requestBody:
        description: Timeseries Query
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/nbq_internal_models.TimeseriesQuery'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/nbq_internal_models.SnapshotOut'
      x-codegen-request-body-name: query
  /timeseries/snapshot:
    post:
      tags:
      - Snapshots
      summary: Snapshot query for multiple ids
      description: An array if queries can be provided containing the desired id measurement
        and snapshot fields if the measure and id are found the values are returned
      requestBody:
        description: Snapshot Query
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/nbq_internal_models.WsSnapshotQuery'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/nbq_internal_models.SnapshotQueryOut'
      x-codegen-request-body-name: query
  /timeseries/snapshot/{id}:
    get:
      tags:
      - Snapshots
      summary: Read a device Snapshot values (last values)
      description: The snapshot endpoint will per default return the last value for
        all properties available for a thing. Use the fields parameter to send a comma
        separated list of fields of only specific fields are required.
      parameters:
      - name: id
        in: path
        description: Device id
        required: true
        schema:
          type: string
      - name: measurement
        in: query
        description: measurement name
        schema:
          type: string
      - name: fields
        in: query
        description: comma separated list of fields
        schema:
          type: string
      - name: tags
        in: query
        description: Tag values (key-value pairs)
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/nbq_internal_models.SnapshotOut'
  /timeseries/snapshotlist/{ids}:
    get:
      tags:
      - Snapshots
      summary: Read a device Snapshot values (last values)
      description: The snapshot endpoint will per default return the last value for
        all properties available for a thing. Use the fields parameter to send a comma
        separated list of fields of only specific fields are required.
      parameters:
      - name: ids
        in: path
        description: Device ids (comma separated)
        required: true
        schema:
          type: string
      - name: measurement
        in: query
        description: measurement name
        schema:
          type: string
      - name: fields
        in: query
        description: comma separated list of fields
        schema:
          type: string
      - name: tags
        in: query
        description: Tag values (key-value pairs)
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/nbq_internal_models.SnapshotOut'
components:
  schemas:
    gormjsonb.JSONB:
      type: object
      additionalProperties: true
    nbq_internal_models.Aggregation:
      type: string
      enum:
      - min
      - avg
      - variance
      - max
      - sum
      - count
      - delta
      - delta_counter
      - stddev
      - last
      - first
      - t_first
      - t_last
      - cumulative_sum
      - cumulative_sum_delta_counter
      - cumulative_sum_delta
      - avg_serial_diff
      x-enum-varnames:
      - AggregationMin
      - AggregationAvg
      - AggregationVariance
      - AggregationMax
      - AggregationSum
      - AggregationCount
      - AggregationDelta
      - AggregationDeltaCount
      - AggregationStddev
      - AggregationLast
      - AggregationFirst
      - AggregationTFirst
      - AggregationTLast
      - AggregationCumulativeSum
      - AggregationCumulativeDeltaCounterSum
      - AggregationCumulativeDeltaSum
      - AggregationAvgSerialDiff
    nbq_internal_models.BackgroundJob:
      type: object
      properties:
        completed_at:
          type: string
        created_at:
          type: string
        error_message:
          type: string
        id:
          type: string
        measurement:
          type: string
        processed_rows:
          type: integer
        progress:
          type: number
        schema:
          type: string
        started_at:
          type: string
        status:
          $ref: '#/components/schemas/nbq_internal_models.JobStatus'
        total_rows:
          type: integer
        type:
          $ref: '#/components/schemas/nbq_internal_models.JobType'
        updated_at:
          type: string
    nbq_internal_models.CorrelationResult:
      type: object
      properties:
        correlations:
          type: array
          description: "[measure1][measure2]"
          items:
            type: array
            items:
              type: number
        measures:
          type: array
          items:
            type: string
        sampleCounts:
          type: array
          description: "[measure]"
          items:
            type: integer
    nbq_internal_models.Date:
      type: object
      properties:
        time.Time:
          type: string
    nbq_internal_models.Geo:
      type: object
      properties:
        altitude:
          type: number
        distanceTraveled:
          type: number
        heading:
          type: number
        id:
          type: string
        lastUpdate:
          type: integer
        lat:
          type: number
        lon:
          type: number
        measurement:
          type: string
        online:
          type: boolean
        speed:
          type: number
        tags:
          $ref: '#/components/schemas/gormjsonb.JSONB'
        time:
          type: integer
    nbq_internal_models.GeoHeartbeat:
      type: object
      properties:
        lastUpdate:
          type: integer
        lat:
          type: number
        lon:
          type: number
    nbq_internal_models.GeoPath:
      type: object
      properties:
        currentPosition:
          $ref: '#/components/schemas/nbq_internal_models.Geo'
        points:
          type: array
          items:
            $ref: '#/components/schemas/nbq_internal_models.Geo'
        totalPoints:
          type: integer
    nbq_internal_models.GeoReverse:
      type: object
      properties:
        city:
          type: string
        country:
          type: string
        countryCode:
          type: string
        fullAddress:
          type: string
        houseNumber:
          type: string
        id:
          type: string
        lat:
          type: number
        lon:
          type: number
        measurement:
          type: string
        postalCode:
          type: string
        street:
          type: string
        time:
          type: integer
    nbq_internal_models.GeoWithReverse:
      type: object
      properties:
        altitude:
          type: number
        distanceTraveled:
          type: number
        geoReverse:
          $ref: '#/components/schemas/nbq_internal_models.GeoReverse'
        heading:
          type: number
        id:
          type: string
        lastUpdate:
          type: integer
        lat:
          type: number
        lon:
          type: number
        measurement:
          type: string
        online:
          type: boolean
        speed:
          type: number
        tags:
          $ref: '#/components/schemas/gormjsonb.JSONB'
        time:
          type: integer
    nbq_internal_models.Heartbeat:
      type: object
      properties:
        geo:
          $ref: '#/components/schemas/nbq_internal_models.GeoHeartbeat'
        id:
          type: string
        lastUpdate:
          type: integer
        measurement:
          type: string
        online:
          type: boolean
    nbq_internal_models.JobStatus:
      type: string
      enum:
      - pending
      - running
      - completed
      - failed
      x-enum-varnames:
      - JobStatusPending
      - JobStatusRunning
      - JobStatusCompleted
      - JobStatusFailed
    nbq_internal_models.JobType:
      type: string
      enum:
      - correlation_update
      - quantile_update
      x-enum-varnames:
      - JobTypeCorrelationUpdate
      - JobTypeQuantileUpdate
    nbq_internal_models.MeasureType:
      type: string
      enum:
      - numeric
      - nonNumeric
      - bool
      x-enum-varnames:
      - MeasureTypeNumeric
      - MeasureTypeNonNumeric
      - MeasureTypeBool
    nbq_internal_models.MeasurementAggregationSize:
      type: object
      properties:
        byteSize:
          type: integer
        interval:
          type: string
        name:
          type: string
        rowCount:
          type: integer
    nbq_internal_models.MeasurementSize:
      type: object
      properties:
        aggregations:
          type: array
          items:
            $ref: '#/components/schemas/nbq_internal_models.MeasurementAggregationSize'
        byteSize:
          type: integer
        date:
          $ref: '#/components/schemas/nbq_internal_models.Date'
        name:
          type: string
        rowCount:
          type: integer
        tenant:
          type: string
    nbq_internal_models.MeasurmentBase:
      type: object
      properties:
        byteSize:
          type: integer
        name:
          type: string
        rowCount:
          type: integer
    nbq_internal_models.QuantileResponse:
      type: object
      properties:
        bucketSize:
          type: integer
        endTime:
          type: string
        errors:
          type: number
        measure:
          type: string
        measurement:
          type: string
        p10:
          type: number
        p25:
          type: number
        p50:
          type: number
        p75:
          type: number
        p90:
          type: number
        startTime:
          type: string
        totalValues:
          type: integer
        updatedAt:
          type: string
    nbq_internal_models.Query:
      required:
      - aggregations
      - id
      - measure
      - queryId
      type: object
      properties:
        aggregations:
          type: array
          items:
            $ref: '#/components/schemas/nbq_internal_models.Aggregation'
        end:
          type: object
        id:
          type: string
        includeTags:
          type: boolean
        max:
          type: number
        measure:
          type: string
        measureType:
          $ref: '#/components/schemas/nbq_internal_models.MeasureType'
        measurement:
          type: string
        min:
          type: number
        precision:
          type: integer
        queryId:
          type: string
        start:
          type: object
        tags:
          type: object
          additionalProperties:
            type: string
    nbq_internal_models.SnapshotOut:
      type: object
      properties:
        id:
          type: string
        lastUpdate:
          type: integer
        measurement:
          type: string
        online:
          type: boolean
        tagId:
          type: string
        values:
          type: array
          items:
            $ref: '#/components/schemas/nbq_internal_models.SnapshotValue'
    nbq_internal_models.SnapshotQueryOut:
      type: object
      properties:
        id:
          type: string
        lastUpdate:
          type: integer
        measurement:
          type: string
        online:
          type: boolean
        queryId:
          type: string
        values:
          type: array
          items:
            $ref: '#/components/schemas/nbq_internal_models.SnapshotQueryValue'
    nbq_internal_models.SnapshotQueryValue:
      type: object
      properties:
        measure:
          type: string
        tags:
          $ref: '#/components/schemas/gormjsonb.JSONB'
        time:
          type: integer
        value:
          type: object
    nbq_internal_models.SnapshotValue:
      type: object
      properties:
        dataType:
          type: string
        id:
          type: string
          description: TODO CHECK IF FIELD CAN BE REMOVED
        measure:
          type: string
        tags:
          $ref: '#/components/schemas/gormjsonb.JSONB'
        time:
          type: integer
        value:
          type: object
    nbq_internal_models.TagsOut:
      type: object
      properties:
        id:
          type: string
        measurement:
          type: string
        tagId:
          type: string
        tags:
          type: object
          additionalProperties:
            type: string
    nbq_internal_models.TagsWithPagination:
      type: object
      properties:
        count:
          maximum: 1000
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/nbq_internal_models.TagsOut'
        limit:
          type: integer
        page:
          type: integer
        pageCount:
          type: integer
    nbq_internal_models.TenantSize:
      type: object
      properties:
        byteSize:
          type: integer
        date:
          $ref: '#/components/schemas/nbq_internal_models.Date'
        measurements:
          type: array
          items:
            $ref: '#/components/schemas/nbq_internal_models.MeasurmentBase'
        rowCount:
          type: integer
        tenant:
          type: string
    nbq_internal_models.TimeBucketGapFill:
      type: string
      enum:
      - none
      - time
      - locf
      - interpolate
      x-enum-varnames:
      - TimeBucketGapFillNone
      - TimeBucketGapFillTime
      - TimeBucketGapFillLocf
      - TimeBucketGapFillInterpolate
    nbq_internal_models.TimeseriesQuery:
      required:
      - queries
      - window
      type: object
      properties:
        gapFill:
          type: object
          allOf:
          - $ref: '#/components/schemas/nbq_internal_models.TimeBucketGapFill'
        queries:
          type: array
          items:
